<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F7F5">
<title>Petty cash</title>
<style>
  :root{
    --paper:#F7F7F5; --card:#FFFFFF; --ink:#1D1D1F; --sub:#6E6E73; --line:#E5E5EA;
    --good:#34C759; --goodtext:#1E9E4B; --bad:#FF3B30; --warntext:#B45309;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    max-width:520px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 18px) 18px 130px;
  }
  button{font:inherit; border:none; background:none; color:inherit}

  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px}
  .app{font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--sub)}
  .topright{display:flex; align-items:center; gap:8px}
  .chipbtn{
    font-size:13px; font-weight:600; background:var(--card);
    border:1px solid var(--line); border-radius:999px; padding:6px 12px;
  }
  .stashchip{
    font-size:13px; font-weight:700; border:1.6px dashed #C7C7CC; border-radius:999px;
    padding:5px 12px; font-variant-numeric:tabular-nums; color:var(--ink);
  }
  .stashchip.neg{color:var(--bad); border-color:#F5B8B4}

  .hero{margin:4px 0 20px}
  .big{
    font-family:ui-rounded, -apple-system, sans-serif;
    font-size:60px; font-weight:800; letter-spacing:-.02em; line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .big small{font-size:29px; font-weight:700; vertical-align:13px; margin-right:2px}
  .big.neg{color:var(--bad)}
  .hero .sub{font-size:14px; color:var(--sub); margin-top:6px}
  .hero .sub b{color:var(--ink); font-weight:600}
  .track{position:relative; height:10px; border-radius:5px; background:#E9E9EC; margin:15px 0 6px; overflow:visible}
  .track .money{position:absolute; left:0; top:0; height:10px; border-radius:5px; background:var(--ink); max-width:100%}
  .track .money.neg{background:var(--bad)}
  .track .half{position:absolute; top:-4px; bottom:-4px; left:50%; border-left:2px dashed #B9B9BF}
  .track .today{position:absolute; top:-5px; width:3px; height:20px; border-radius:2px; background:var(--ink)}
  .trackmeta{display:flex; justify-content:space-between; font-size:11.5px; color:#A0A0A6; font-variant-numeric:tabular-nums}

  .env{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px 16px 13px; margin-bottom:10px}
  .env .row{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .env .name{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
  .env .name .sp{font-size:12px; font-weight:500; color:var(--sub); margin-left:7px; font-variant-numeric:tabular-nums}
  .env .left{font-family:ui-rounded,-apple-system,sans-serif; font-size:24px; font-weight:800; font-variant-numeric:tabular-nums}
  .env .left.ok{color:var(--goodtext)}
  .env .left.warn{color:var(--warntext)}
  .env .left.neg{color:var(--bad)}
  .env .bar{height:7px; border-radius:4px; background:#EDEDF0; margin-top:10px; position:relative; overflow:hidden}
  .env .fill{height:7px; position:absolute; left:0; top:0; background:var(--ink); border-radius:4px}
  .env .fill.neg{background:var(--bad)}
  .env .abs{
    height:7px; position:absolute; top:0;
    background:repeating-linear-gradient(135deg,#C9C9CE 0 4px,#EDEDF0 4px 8px);
  }
  .env .meta{font-size:12px; color:var(--sub); display:flex; justify-content:space-between; margin-top:8px}
  .env .meta .over{color:var(--bad); font-weight:600}
  .env.hot{border-color:#FFD4D1; background:#FFF7F6}

  .receipt{
    background:var(--card); border:1px solid var(--line); border-radius:4px 4px 16px 16px;
    margin-top:20px; padding:14px 16px 8px; position:relative;
  }
  .receipt:before{content:""; position:absolute; top:-1px; left:0; right:0; border-top:2px dashed #D6D6DA}
  .receipt h3{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:11px; letter-spacing:.18em; color:var(--sub); font-weight:600; margin-bottom:8px}
  .rline{
    width:100%; text-align:left; font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12.5px;
    display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1px solid #F0F0F2;
    font-variant-numeric:tabular-nums;
  }
  .rline:last-child{border-bottom:0}
  .rline .d{color:var(--sub); width:42px; flex:none}
  .rline .c{width:14px; flex:none; font-weight:700; color:var(--sub)}
  .rline .m{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rline .a{font-weight:700}
  .rline .a.in{color:var(--goodtext)}
  .empty{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px; color:#A6A6AC; padding:10px 0 12px}

  .entrybar{
    position:fixed; left:0; right:0; bottom:0; max-width:520px; margin:0 auto;
    padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);
    background:linear-gradient(180deg, rgba(247,247,245,0) 0%, var(--paper) 26%);
    display:flex; gap:9px;
  }
  .kbtn{
    flex:1; border-radius:18px; padding:16px 0 14px; color:#fff; background:var(--ink);
    font-family:ui-rounded,-apple-system,sans-serif; font-size:15px; font-weight:800;
  }
  .kbtn span{display:block; font-size:10.5px; font-weight:600; opacity:.8; margin-top:2px;
    font-family:-apple-system,sans-serif; font-variant-numeric:tabular-nums}
  .kbtn span.neg{color:#FFB3AD; opacity:1}
  .kstash{
    flex:0 0 54px; border-radius:18px; border:1.8px dashed #B9B9BF; color:var(--sub);
    font-size:22px; font-weight:700; background:var(--paper);
  }

  /* ---------- vault ---------- */
  .tabs{display:flex; gap:8px; margin:18px 0 10px}
  .tab{flex:1; text-align:center; padding:9px 0; border-radius:12px; font-size:13px; font-weight:700;
       background:#EFEFF1; color:var(--sub)}
  .tab.on{background:var(--ink); color:#fff}
  .vault{background:#101013; border-radius:20px; padding:20px 18px 18px; color:#EDEDF0; position:relative; overflow:hidden}
  .veyebrow{font-size:10.5px; font-weight:700; letter-spacing:.18em; color:#8E8E96; text-transform:uppercase}
  .lifetime{font-family:ui-rounded,-apple-system,sans-serif; font-weight:800; font-size:38px;
    color:#3EDC72; font-variant-numeric:tabular-nums; letter-spacing:-.01em;
    text-shadow:0 0 24px rgba(62,220,114,.35); margin-top:2px}
  .lifetime small{font-size:19px; vertical-align:8px}
  .vrate{font-size:12px; color:#8E8E96; margin:4px 0 15px; font-variant-numeric:tabular-nums}
  .vday{margin-bottom:15px}
  .vdaytop{display:flex; justify-content:space-between; font-size:12px; color:#8E8E96; margin-bottom:6px; font-variant-numeric:tabular-nums}
  .vdaytop b{color:#EDEDF0}
  .vdaybar{height:6px; border-radius:3px; background:#1E1E24; overflow:hidden}
  .vdayfill{height:6px; background:#3EDC72; border-radius:3px; box-shadow:0 0 10px rgba(62,220,114,.5)}
  .goal{background:#17171C; border:1px solid #26262B; border-radius:16px; padding:14px 15px; position:relative}
  .goal .grow{display:flex; justify-content:space-between; align-items:baseline}
  .goal .gname{font-size:15px; font-weight:700}
  .goal .gnum{font-family:ui-rounded,-apple-system,sans-serif; font-size:18px; font-weight:800; font-variant-numeric:tabular-nums}
  .goal .gnum small{color:#8E8E96; font-size:13px; font-weight:600}
  .gbar{height:12px; border-radius:6px; background:#101015; margin:11px 0 9px; position:relative; overflow:hidden}
  .gsolid{height:12px; position:absolute; left:0; background:#3EDC72; border-radius:6px;
          transition:width .9s cubic-bezier(.22,1.6,.36,1)}
  .gpend{height:12px; position:absolute; background:rgba(62,220,114,.28); border-radius:0 6px 6px 0}
  .gmeta{display:flex; justify-content:space-between; font-size:12px; color:#8E8E96; font-variant-numeric:tabular-nums}
  .gmeta b{color:#EDEDF0}
  .stamp{position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(16,16,19,.72); border-radius:16px; z-index:3}
  .stamp span{font-family:ui-rounded,-apple-system,sans-serif; font-weight:800; font-size:30px; color:#3EDC72;
    border:3px solid #3EDC72; border-radius:12px; padding:6px 18px; transform:rotate(-8deg) scale(3); opacity:0;
    text-shadow:0 0 24px rgba(62,220,114,.6)}
  .stamp.go{display:flex}
  .stamp.go span{animation:slam .5s cubic-bezier(.2,1.4,.3,1) forwards}
  @keyframes slam{to{transform:rotate(-8deg) scale(1); opacity:1}}
  .queue{display:flex; gap:8px; margin-top:10px}
  .qgoal{flex:1; background:#141419; border:1px dashed #2C2C33; border-radius:12px; padding:9px 11px;
         font-size:12px; color:#8E8E96; font-variant-numeric:tabular-nums}
  .qgoal b{display:block; color:#C9C9D0; font-size:13px}
  .qgoal.donez{opacity:.55}
  .fly{position:fixed; z-index:50; font-family:ui-rounded,-apple-system,sans-serif; font-weight:800; font-size:15px;
    padding:7px 13px; border-radius:999px; pointer-events:none;
    transition:transform 1s cubic-bezier(.25,1,.35,1), opacity 1s}
  .fly.v{background:#3EDC72; color:#08240F}
  .fly.s{background:#fff; color:var(--ink); border:1.6px dashed #999}
  .cf{position:fixed; width:8px; height:12px; z-index:60; pointer-events:none; top:-14px; border-radius:2px;
      animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
  .stashchip{transition:transform .3s}
  .stashchip.pop{transform:scale(1.18); border-color:var(--good); color:var(--goodtext)}

  /* ---------- sheet ---------- */
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.28); display:none; z-index:9}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; max-width:520px; margin:0 auto; z-index:10;
    background:var(--paper); border-radius:26px 26px 0 0; padding:12px 18px calc(env(safe-area-inset-bottom) + 16px);
    transform:translateY(105%); transition:transform .22s ease; box-shadow:0 -8px 40px rgba(0,0,0,.14);
  }
  .sheet.open{transform:translateY(0)}
  .scrim.open{display:block}
  .grab{width:38px; height:5px; border-radius:3px; background:#D8D8DC; margin:0 auto 14px}
  .chips{display:flex; gap:8px; margin-bottom:14px}
  .chip{
    flex:1; text-align:center; padding:10px 0; border-radius:14px; font-size:14px; font-weight:700;
    background:#EFEFF1; color:var(--sub); font-family:ui-rounded,-apple-system,sans-serif;
  }
  .chip.on{background:var(--ink); color:#fff}
  .stashmode{display:none; gap:8px; margin-bottom:14px}
  .stashmode.show{display:flex}
  .amt{
    text-align:center; font-family:ui-rounded,-apple-system,sans-serif; font-weight:800;
    font-size:52px; margin:2px 0; font-variant-numeric:tabular-nums; min-height:60px;
  }
  .amt small{font-size:26px; vertical-align:11px}
  .remain{text-align:center; font-size:13px; color:var(--sub); margin-bottom:12px; min-height:16px; font-variant-numeric:tabular-nums}
  .remain b.neg{color:var(--bad)} .remain b.ok{color:var(--goodtext)}
  .frow{display:flex; gap:8px; margin-bottom:8px}
  .qnotes{display:flex; gap:7px; margin-bottom:8px; flex-wrap:wrap}
  .qnotes:empty{display:none}
  .qn{
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:8px 13px; font-size:13px; font-weight:600; color:var(--sub);
  }
  .qn:active{background:#ECECEF}
  .field{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 13px; font-size:15px; display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .field input{border:none; outline:none; background:none; font:inherit; width:100%; color:var(--ink)}
  .field input::placeholder{color:#A6A6AC}
  .datechip{
    flex:0 0 auto; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 13px; font-size:14px; font-weight:600;
  }
  .datechip.alt{color:var(--sub); font-weight:500}
  .datechip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0}
  .key{
    background:var(--card); border:1px solid var(--line); border-radius:14px; text-align:center;
    padding:14px 0; font-size:21px; font-weight:600;
    font-family:ui-rounded,-apple-system,sans-serif;
  }
  .key:active{background:#ECECEF}
  .key.mute{background:transparent; border-color:transparent; color:var(--sub); font-size:17px}
  .save{
    width:100%; border-radius:18px; padding:16px 0; background:var(--ink); color:#fff;
    font-size:17px; font-weight:800; font-family:ui-rounded,-apple-system,sans-serif;
  }
  .save:disabled{opacity:.35}
  .sheetfoot{display:flex; justify-content:space-between; margin-top:12px}
  .cancel,.del{font-size:14px; color:var(--sub); padding:4px 8px}
  .del{color:var(--bad); font-weight:600; display:none}
  .del.show{display:block}

  /* ---------- history ---------- */
  .hist{
    position:fixed; inset:0; background:var(--paper); z-index:20; display:none;
    max-width:520px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 18px) 18px 30px; overflow-y:auto;
  }
  .hist.open{display:block}
  .hist .toprow{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px}
  .hist h2{font-size:20px; font-weight:800; font-family:ui-rounded,-apple-system,sans-serif}
  .close{font-size:15px; font-weight:600; color:var(--sub); padding:6px 10px}
  .prow{
    width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:13px 15px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;
    font-variant-numeric:tabular-nums;
  }
  .prow .pn{font-size:14px; font-weight:600}
  .prow .pv{font-size:13px; color:var(--sub)}
  .prow .pv b.ok{color:var(--goodtext)} .prow .pv b.neg{color:var(--bad)}
  .exp{margin-top:14px; width:100%; text-align:center; font-size:13px; color:var(--sub); padding:10px; border:1px dashed #C7C7CC; border-radius:14px}
</style>
</head>
<body>

<div class="topbar">
  <div class="app">Petty cash</div>
  <div class="topright">
    <button class="stashchip" id="stashChip">⌁ $0</button>
    <button class="chipbtn" id="periodChip">— ▾</button>
  </div>
</div>

<div class="hero">
  <div class="big" id="heroBig"><small>$</small>550</div>
  <div class="sub" id="heroSub"></div>
  <div class="track">
    <div class="money" id="trackMoney"></div>
    <div class="half"></div>
    <div class="today" id="trackToday"></div>
  </div>
  <div class="trackmeta"><span id="tmSpent"></span><span id="tmEnd"></span></div>
</div>

<div id="envs"></div>

<div class="tabs">
  <button class="tab on" id="tabV">Vault</button>
  <button class="tab" id="tabT">Tape</button>
</div>

<div class="vault" id="vaultPanel">
  <div class="veyebrow">All-time saved</div>
  <div class="lifetime" id="vLifetime"><small>$</small>0.00000</div>
  <div class="vrate" id="vRate"></div>
  <div class="vday">
    <div class="vdaytop"><span>today</span><b id="vToday">+$0.00000</b></div>
    <div class="vdaybar"><div class="vdayfill" id="vDayFill" style="width:0%"></div></div>
  </div>
  <button class="goal" id="goalCard" style="width:100%; text-align:left; display:block">
    <div class="grow"><div class="gname" id="gName"></div>
      <div class="gnum"><span id="gBanked"></span> <small id="gTarget"></small></div></div>
    <div class="gbar"><div class="gsolid" id="gSolid"></div><div class="gpend" id="gPend"></div></div>
    <div class="gmeta"><span id="gPct"></span><b id="gEta"></b></div>
    <div class="stamp" id="stamp"><span>FUNDED</span></div>
  </button>
  <div class="queue" id="vQueue"></div>
</div>

<div class="receipt" id="tapePanel" style="display:none">
  <h3 id="tapeTitle">THIS PERIOD</h3>
  <div id="tape"></div>
</div>

<div class="entrybar" id="entrybar">
  <button class="kbtn" data-cat="g">Grocery<span id="qg"></span></button>
  <button class="kbtn" data-cat="f">Fun<span id="qf"></span></button>
  <button class="kbtn" data-cat="o">Other<span id="qo"></span></button>
  <button class="kstash" data-cat="s">⌁</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="chips" id="catChips">
    <button class="chip" data-cat="g">Grocery</button>
    <button class="chip" data-cat="f">Fun</button>
    <button class="chip" data-cat="o">Other</button>
  </div>
  <div class="stashmode" id="stashMode">
    <button class="chip" data-dir="-1">Spend</button>
    <button class="chip" data-dir="1">Add</button>
    <button class="chip" data-dir="w">Windfall</button>
  </div>
  <div class="amt" id="amtView"><small>$</small>0</div>
  <div class="remain" id="remainView"></div>
  <div class="qnotes" id="qNotes"></div>
  <div class="frow">
    <div class="field"><input id="noteInput" placeholder="Note" autocomplete="off" enterkeyhint="done"></div>
  </div>
  <div class="frow">
    <button class="datechip on" id="dToday">Today</button>
    <button class="datechip alt" id="dYest">Yesterday</button>
    <button class="datechip alt" id="dPick">…</button>
    <input type="date" id="dInput" style="position:absolute; opacity:0; pointer-events:none">
  </div>
  <div class="pad" id="pad">
    <button class="key">1</button><button class="key">2</button><button class="key">3</button>
    <button class="key">4</button><button class="key">5</button><button class="key">6</button>
    <button class="key">7</button><button class="key">8</button><button class="key">9</button>
    <button class="key mute">00</button><button class="key">0</button><button class="key mute">⌫</button>
  </div>
  <button class="save" id="saveBtn" disabled>Log</button>
  <div class="sheetfoot">
    <button class="del" id="delBtn">Delete</button>
    <button class="cancel" id="cancelBtn" style="margin-left:auto">Cancel</button>
  </div>
</div>

<div class="hist" id="hist">
  <div class="toprow"><h2>History</h2><button class="close" id="histClose">Done</button></div>
  <div id="histList"></div>
  <button class="exp" id="expBtn">Copy all data as JSON</button>
</div>

<script>
"use strict";
/* ============ CONFIG — edit in the vault, not in the app ============ */
const BUDGET = { g:200, f:200, o:150 };
const TOTAL  = 550;
const WARN_AT = 1/3;                  // yellow at/below a third of budget remaining
const NAMES  = { g:"Groceries", f:"Fun", o:"Transport + other", s:"Stash" };
const LETTER = { g:"G", f:"F", o:"O", s:"⌁", v:"V" };
/* vault config — edit in the vault, not the app */
const VAULT_PER_PERIOD = 442;
const VAULT_GOALS = [
  {name:"Emergency fund", target:3000},
  {name:"Perkins payoff", target:3000},
  {name:"Discover payoff", target:4917},
];
const EPOCH  = "2026-08-16";          // first tracked period start
const QUICKNOTES = {
  g: ["Target","Sprouts","Groc Outlet","Berk Bowl"],
  o: ["Ride home","Ride office","Ride"],
  f: [], s: []
};

/* ============ storage ============ */
const K_TX="pc.tx.v1", K_STASH="pc.stash.v1", K_SETTLED="pc.settled.v1";
const load=(k,d)=>{ try{const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v}catch(e){return d} };
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let TX      = load(K_TX, []);         // {id, date:"YYYY-MM-DD", cat, amt(+spend/-refund; stash: +add/-spend... see below), note}
let STASH   = load(K_STASH, 0);       // running balance, moved only by stash tx + settlements
let SETTLED = load(K_SETTLED, {});    // {periodId:true}

/* tx sign convention: envelope cats: amt>0 = spend, amt<0 = refund.
   stash cat: amt>0 = add, amt<0 = spend. */

/* ============ dates & periods ============ */
const p2=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const fromIso=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
function periodOf(dateStr){
  const d=fromIso(dateStr);
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${d.getDate()<=15?"A":"B"}`;
}
function periodBounds(pid){
  const [y,m,h]=pid.split("-"); const yr=+y, mo=+m-1;
  if(h==="A") return { s:new Date(yr,mo,1),  e:new Date(yr,mo,15) };
  return { s:new Date(yr,mo,16), e:new Date(yr,mo+1,0) };
}
function periodLabel(pid){
  const {s,e}=periodBounds(pid);
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${M[s.getMonth()]} ${s.getDate()}–${e.getDate()}`;
}
function prevPeriod(pid){
  const {s}=periodBounds(pid);
  const d=new Date(s); d.setDate(d.getDate()-1);
  return periodOf(iso(d));
}
function allPeriodsSince(epochPid, nowPid){
  const out=[]; let p=epochPid;
  while(p<=nowPid && out.length<200){ out.push(p); 
    const {e}=periodBounds(p); const n=new Date(e); n.setDate(n.getDate()+1); p=periodOf(iso(n));
  }
  return out;
}

/* ============ math ============ */
const txIn=pid=>TX.filter(t=>(t.cat==="g"||t.cat==="f"||t.cat==="o") && periodOf(t.date)===pid);
const spent=(pid,cat)=>txIn(pid).filter(t=>t.cat===cat).reduce((s,t)=>s+t.amt,0);
const spentAll=pid=>txIn(pid).reduce((s,t)=>s+t.amt,0);

function settlePast(){
  const nowPid=periodOf(iso(new Date()));
  for(const pid of allPeriodsSince(periodOf(EPOCH), nowPid)){
    if(pid===nowPid) break;
    if(SETTLED[pid]) continue;
    STASH += TOTAL - spentAll(pid);     // leftover in, overage out
    SETTLED[pid]=true;
  }
  save(K_STASH,STASH); save(K_SETTLED,SETTLED);
}

/* ============ vault engine ============ */
const K_VAULT="pc.vault.v1";
let V = load(K_VAULT, {lastPid: periodOf(iso(new Date())), shown: 0, doneSeen: [], celebq: []});
const vaultTx=()=>TX.filter(t=>t.cat==="v");
function pour(){
  const lifetime=vaultTx().reduce((s,t)=>s+t.amt,0);
  let rem=Math.max(0,lifetime);
  const goals=VAULT_GOALS.map(g=>{
    const banked=Math.min(rem,g.target); rem-=banked;
    return {name:g.name, target:g.target, banked, done: banked>=g.target};
  });
  const active=goals.find(g=>!g.done)||goals[goals.length-1];
  return {lifetime, goals, active, overflow:rem};
}
function periodSecs(pid){ const {s,e}=periodBounds(pid); return (e-s)/1000+86400; }
function pendingNow(){
  const pid=periodOf(iso(new Date()));
  const sec=(Date.now()-periodBounds(pid).s.getTime())/1000;
  return VAULT_PER_PERIOD*Math.max(0,sec)/periodSecs(pid);
}
function settleVault(){
  const nowPid=periodOf(iso(new Date()));
  let credited=0;
  for(const pid of allPeriodsSince(V.lastPid,nowPid)){
    if(pid===V.lastPid) continue;
    if(!TX.some(t=>t.cat==="v"&&t.auto===pid)){
      TX.push({id:Date.now()+Math.floor(Math.random()*9999), date:iso(periodBounds(pid).s),
               cat:"v", amt:VAULT_PER_PERIOD, note:"PAYDAY", auto:pid});
      credited+=VAULT_PER_PERIOD;
    }
  }
  V.lastPid=nowPid;
  if(credited>0){ V.celebq.push({type:"payday",amt:credited}); save(K_TX,TX); }
  for(const g of pour().goals){
    if(g.done && !V.doneSeen.includes(g.name)){ V.doneSeen.push(g.name); V.celebq.push({type:"goal",name:g.name}); }
  }
  save(K_VAULT,V);
}
/* --- fx --- */
function confetti(n){
  const colors=["#3EDC72","#FFD34E","#7FD8FF","#FF7AB6","#FFFFFF"];
  for(let i=0;i<n;i++){
    const c=document.createElement("div"); c.className="cf";
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(1.3+Math.random()*1.4)+"s";
    c.style.animationDelay=(Math.random()*.35)+"s";
    document.body.appendChild(c); setTimeout(()=>c.remove(),3300);
  }
}
let ROLLUP={from:null,to:null,t0:0};
function playCelebs(){
  const lifeNow=pour().lifetime+pendingNow();
  if(V.shown>0 && lifeNow-V.shown>1){ ROLLUP={from:V.shown,to:lifeNow,t0:performance.now()}; }
  let delay=ROLLUP.from!=null?1400:200;
  for(const ev of V.celebq){
    if(ev.type==="payday"){ setTimeout(()=>confetti(14),delay); delay+=900; }
    if(ev.type==="goal"){
      setTimeout(()=>{ $("stamp").classList.add("go"); confetti(70);
        setTimeout(()=>{$("stamp").classList.remove("go"); renderVaultStatic();},2100); },delay);
      delay+=2300;
    }
  }
  V.celebq=[]; V.shown=lifeNow; save(K_VAULT,V);
}
function windfallAnim(v80,s20){
  const src=$("saveBtn").getBoundingClientRect?$("sheet").getBoundingClientRect():{left:100,top:400,width:200};
  const vt=$("vaultPanel").getBoundingClientRect();
  const st=$("stashChip").getBoundingClientRect();
  const mk=(cls,txt)=>{const f=document.createElement("div"); f.className="fly "+cls; f.textContent=txt;
    f.style.left=src.left+src.width/2-56+"px"; f.style.top=src.top+20+"px"; document.body.appendChild(f); return f};
  const a=mk("v","+"+money(v80)+" → vault"), b=mk("s","+"+money(s20)+" → stash");
  requestAnimationFrame(()=>{
    a.style.transform=`translate(${vt.left-src.left+30}px, ${vt.top-src.top-10}px) scale(.85)`;
    b.style.transform=`translate(${st.left-src.left-30}px, ${st.top-src.top-10}px) scale(.8)`;
    setTimeout(()=>{a.style.opacity=0; b.style.opacity=0},850);
  });
  setTimeout(()=>{ $("stashChip").classList.add("pop");
    setTimeout(()=>$("stashChip").classList.remove("pop"),450);
    confetti(18); a.remove(); b.remove(); },900);
}
/* --- vault paint --- */
const fmt5=v=>v.toLocaleString("en-US",{minimumFractionDigits:5,maximumFractionDigits:5});
function renderVaultStatic(){
  const {goals,active}=pour();
  $("gName").textContent=active.name;
  $("gBanked").textContent=money(active.banked);
  $("gTarget").textContent="/ "+money(active.target);
  const perDay=VAULT_PER_PERIOD/(periodSecs(periodOf(iso(new Date())))/86400);
  $("vRate").textContent="$"+VAULT_PER_PERIOD+" / period · "+money(perDay)+" / day · always running";
  $("vQueue").innerHTML=goals.filter(g=>g.name!==active.name).map(g=>
    `<div class="qgoal${g.done?" donez":""}"><b>${g.name.split(" ")[0]}${g.done?" ✓":""}</b>${g.done?"funded":money(g.target)}</div>`
  ).join("");
}
function vaultFrame(now){
  const {active}=pour();
  let life=pour().lifetime+pendingNow();
  if(ROLLUP.from!=null){
    const k=Math.min(1,(now-ROLLUP.t0)/1300);
    life=ROLLUP.from+(ROLLUP.to-ROLLUP.from)*(1-Math.pow(1-k,3));
    if(k>=1) ROLLUP={from:null,to:null,t0:0};
  }
  $("vLifetime").innerHTML="<small>$</small>"+fmt5(life);
  const d=new Date();
  const daySec=d.getHours()*3600+d.getMinutes()*60+d.getSeconds()+d.getMilliseconds()/1000;
  const perSec=VAULT_PER_PERIOD/periodSecs(periodOf(iso(d)));
  $("vToday").textContent="+$"+fmt5(daySec*perSec);
  $("vDayFill").style.width=(daySec/864).toFixed(2)+"%";
  const pend=pendingNow();
  const ps=Math.min(100,active.banked/active.target*100);
  const pp=Math.min(100-ps,pend/active.target*100);
  $("gSolid").style.width=ps+"%";
  $("gPend").style.left=ps+"%"; $("gPend").style.width=pp+"%";
  $("gPct").textContent=Math.min(100,(active.banked+pend)/active.target*100).toFixed(3)+"%";
  const remAmt=active.target-active.banked-pend;
  if(remAmt<=0){ $("gEta").textContent="full"; }
  else{
    const days=Math.ceil(remAmt/(VAULT_PER_PERIOD/15.2));
    const eta=new Date(Date.now()+days*864e5);
    const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    $("gEta").textContent=`full in ${days} days · ${M[eta.getMonth()]} ${eta.getDate()}`;
  }
  requestAnimationFrame(vaultFrame);
}

/* ============ render ============ */
const $=id=>document.getElementById(id);
const money=v=>{
  const neg=v<0, a=Math.abs(v);
  const s=a%1===0?a.toFixed(0):a.toFixed(2);
  return (neg?"−$":"$")+s;
};
let VIEW_PID=null;   // null = current

function render(){
  settlePast();
  const nowPid=periodOf(iso(new Date()));
  const pid=VIEW_PID||nowPid, live=pid===nowPid;
  const {s,e}=periodBounds(pid);
  const days=e.getDate()-s.getDate()+1;
  const today=new Date(); today.setHours(0,0,0,0);
  const dayN=live?Math.min(days,Math.max(1,Math.round((today-s)/864e5)+1)):days;

  $("periodChip").textContent=periodLabel(pid)+" ▾";
  const st=$("stashChip");
  st.textContent="⌁ "+money(STASH);
  st.classList.toggle("neg",STASH<0);

  const sp=spentAll(pid), rem=TOTAL-sp;
  const hb=$("heroBig");
  hb.innerHTML=(rem<0?"−":"")+'<small>$</small>'+(Math.abs(rem)%1===0?Math.abs(rem).toFixed(0):Math.abs(rem).toFixed(2));
  hb.classList.toggle("neg",rem<0);
  const left=days-dayN+1;
  $("heroSub").innerHTML=live
    ? `of $${TOTAL} · <b>${money(Math.max(0,rem)/Math.max(1,left)).replace("$","$")} / day</b> for ${left} day${left===1?"":"s"}`
    : `of $${TOTAL} · period closed`;
  const pctS=Math.min(100,Math.max(0,sp/TOTAL*100)), pctT=dayN/days*100;
  const tm=$("trackMoney"); tm.style.width=pctS+"%"; tm.classList.toggle("neg",sp>TOTAL);
  $("trackToday").style.left=`calc(${pctT}% - 1px)`;
  $("trackToday").style.display=live?"block":"none";
  $("tmSpent").textContent=`${Math.round(sp/TOTAL*100)}% spent / ${Math.round(pctT)}% elapsed`;
  $("tmEnd").textContent=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][e.getMonth()]+" "+e.getDate();

  /* envelopes */
  const overageGF=Math.max(0,spent(pid,"g")-BUDGET.g)+Math.max(0,spent(pid,"f")-BUDGET.f);
  let html="";
  const SHORT={g:"Grocery",f:"Fun",o:"Other"};
  for(const c of ["g","f","o"]){
    const sc=spent(pid,c), b=BUDGET[c];
    let remC=b-sc;
    const isO=c==="o";
    const absorbed=isO?overageGF:0;
    if(isO) remC-=absorbed;
    const over=remC<0 || sc>b;
    const pfill=Math.min(100,sc/b*100);
    const pabs=isO?Math.min(100-pfill,absorbed/b*100):0;
    const status = remC<0 ? "neg" : (remC<=b*WARN_AT ? "warn" : "ok");
    html+=`<div class="env${over?" hot":""}">
      <div class="row"><div class="name">${SHORT[c]}<span class="sp">spent ${money(sc)}/$${b}</span></div>
        <div class="left ${status}">${money(remC)}</div></div>
      <div class="bar"><div class="fill${sc>b?" neg":""}" style="width:${pfill}%"></div>
        ${pabs>0?`<div class="abs" style="left:${pfill}%;width:${pabs}%"></div>`:""}</div>
      ${(sc>b||absorbed>0)?`<div class="meta">
          <span>${isO&&absorbed>0?`own ${money(sc)} · absorbed ${money(absorbed)}`:""}</span>
          ${sc>b?`<span class="over">${money(sc-b)} over → Other</span>`:""}
        </div>`:""}
    </div>`;
  }
  $("envs").innerHTML=html;

  /* quick buttons */
  const qs={g:"qg",f:"qf",o:"qo"};
  for(const c of ["g","f","o"]){
    let r=BUDGET[c]-spent(nowPid,c);
    if(c==="o") r-=Math.max(0,spent(nowPid,"g")-BUDGET.g)+Math.max(0,spent(nowPid,"f")-BUDGET.f);
    const el=$(qs[c]); el.textContent=money(r)+(r<0?"":" left");
    el.classList.toggle("neg",r<0);
  }

  /* tape */
  $("tapeTitle").textContent=live?"THIS PERIOD":periodLabel(pid).toUpperCase();
  const rows=TX.filter(t=>periodOf(t.date)===pid || (live&&t.cat==="s"&&periodOf(t.date)===pid))
               .filter(t=>periodOf(t.date)===pid)
               .sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  $("tape").innerHTML=rows.length?rows.map(t=>{
    const d=fromIso(t.date);
    const isIn=((t.cat==="s"||t.cat==="v")&&t.amt>0)||((t.cat!=="s"&&t.cat!=="v")&&t.amt<0);
    const shown=(t.cat==="s"||t.cat==="v")?t.amt:-t.amt;
    return `<button class="rline" data-id="${t.id}">
      <span class="d">${d.getMonth()+1}/${p2(d.getDate())}</span>
      <span class="c">${LETTER[t.cat]}</span>
      <span class="m">${(t.note||NAMES[t.cat]).toUpperCase()}</span>
      <span class="a${isIn?" in":""}">${shown>=0?"+":"−"}${Math.abs(shown).toFixed(2)}</span>
    </button>`;
  }).join(""):`<div class="empty">nothing logged</div>`;
  $("entrybar").style.display=live?"flex":"none";
}

/* ============ entry sheet ============ */
let S={open:false, cat:"g", dir:-1, digits:"", date:iso(new Date()), editId:null};
function amtVal(){ return S.digits? parseInt(S.digits,10)/100 : 0 }
function openSheet(cat, edit){
  S.open=true; S.cat=cat; S.dir=-1; S.digits=""; S.date=iso(new Date()); S.editId=null;
  if(cat==="v") S.dir=1;
  if(edit){ S.editId=edit.id; S.cat=edit.cat; S.date=edit.date;
    S.digits=String(Math.round(Math.abs(edit.amt)*100)); if(edit.cat==="s") S.dir=edit.amt>0?1:-1;
    $("noteInput").value=edit.note||"";
  } else $("noteInput").value="";
  $("catChips").style.display=(cat==="s"||cat==="v")?"none":"flex";
  $("stashMode").classList.toggle("show",cat==="s"||cat==="v");
  if(cat==="v"){
    document.querySelectorAll("#stashMode .chip").forEach((b,i)=>{
      b.textContent=["Deduct","Add","Windfall"][i];
      if(b.dataset.dir==="w") b.style.display="none";
    });
  } else {
    document.querySelectorAll("#stashMode .chip").forEach((b,i)=>{
      b.textContent=["Spend","Add","Windfall"][i]; b.style.display="";
    });
  }
  $("delBtn").classList.toggle("show",!!edit);
  syncSheet();
  $("scrim").classList.add("open"); $("sheet").classList.add("open");
}
function closeSheet(){ S.open=false; $("scrim").classList.remove("open"); $("sheet").classList.remove("open") }
function syncSheet(){
  const qn=(QUICKNOTES[S.cat]||[]);
  $("qNotes").innerHTML=qn.map(n=>`<button class="qn">${n}</button>`).join("");
  document.querySelectorAll("#catChips .chip").forEach(b=>b.classList.toggle("on",b.dataset.cat===S.cat));
  document.querySelectorAll("#stashMode .chip").forEach(b=>b.classList.toggle("on",+b.dataset.dir===S.dir));
  const v=amtVal();
  const fv=amtVal();
  $("amtView").innerHTML='<small>$</small>'+(S.digits? fv.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}) : "0");
  const nowPid=periodOf(iso(new Date()));
  if(S.cat==="s"&&S.dir==="w"){
    $("remainView").innerHTML=v>0?`80% → vault <b class="ok">${money(v*0.8)}</b> · 20% → stash <b class="ok">${money(v*0.2)}</b>`:"";
  } else if(S.cat==="s"){
    const after=STASH+((+S.dir)*v)-(S.editId?getTx(S.editId).amt:0)*(S.editId&&getTx(S.editId).cat==="s"?1:0);
    $("remainView").innerHTML=`Stash after this: <b class="${after<0?"neg":"ok"}">${money(after)}</b>`;
  } else if(S.cat==="v"){
    const after=pour().lifetime+(+S.dir)*v;
    $("remainView").innerHTML=`Vault after this: <b class="${after<0?"neg":"ok"}">${money(after)}</b>`;
  } else {
    const prior=S.editId&&getTx(S.editId).cat===S.cat&&periodOf(getTx(S.editId).date)===periodOf(S.date)?getTx(S.editId).amt:0;
    const after=BUDGET[S.cat]-spent(periodOf(S.date),S.cat)-v+prior;
    $("remainView").innerHTML=`${NAMES[S.cat]} after this: <b class="${after<0?"neg":"ok"}">${money(after)}</b>`;
  }
  const t=iso(new Date()); const y=iso(new Date(Date.now()-864e5));
  $("dToday").className="datechip"+(S.date===t?" on":"");
  $("dYest").className="datechip"+(S.date===y?" on":" alt");
  $("dPick").className="datechip"+((S.date!==t&&S.date!==y)?" on":" alt");
  $("dPick").textContent=(S.date!==t&&S.date!==y)?S.date.slice(5).replace("-","/"):"…";
  const verb=S.cat==="s"?(S.dir==="w"?"Split":(+S.dir>0?"Add":"Spend")):(S.cat==="v"?(+S.dir>0?"Add":"Deduct"):"Log");
  $("saveBtn").textContent=v>0?`${verb} ${money(v)}${S.cat==="s"?"":" to "+NAMES[S.cat].split(" ")[0]}`:verb;
  $("saveBtn").disabled=!(v>0);
}
const getTx=id=>TX.find(t=>t.id===id);
function commit(){
  const v=amtVal(); if(!(v>0)) return;
  if(S.cat==="s"&&S.dir==="w"&&!S.editId){
    const note=$("noteInput").value.trim()||"WINDFALL";
    const v80=Math.round(v*80)/100, s20=Math.round(v*100-v80*100)/100;
    TX.push({id:Date.now(), date:S.date, cat:"v", amt:v80, note:note+" 80%"});
    TX.push({id:Date.now()+1, date:S.date, cat:"s", amt:s20, note:note+" 20%"});
    STASH+=s20; save(K_TX,TX); save(K_STASH,STASH);
    closeSheet(); render(); windfallAnim(v80,s20);
    V.shown=pour().lifetime+pendingNow(); save(K_VAULT,V);
    return;
  }
  const rec={ id:S.editId||Date.now(), date:S.date, cat:S.cat,
              amt:S.cat==="s"? (+S.dir)*v : (S.cat==="v"? (+S.dir)*v : v), note:$("noteInput").value.trim() };
  if(S.editId){
    const old=getTx(S.editId);
    if(old.cat==="s") STASH-=old.amt;
    TX=TX.filter(t=>t.id!==S.editId);
  }
  TX.push(rec);
  if(rec.cat==="s") STASH+=rec.amt;
  save(K_TX,TX); save(K_STASH,STASH);
  closeSheet(); render();
  if(rec.cat==="v"){ V.shown=pour().lifetime+pendingNow(); save(K_VAULT,V); renderVaultStatic(); }
}
function removeTx(){
  if(!S.editId) return;
  const old=getTx(S.editId);
  if(old && old.cat==="s") STASH-=old.amt;
  TX=TX.filter(t=>t.id!==S.editId);
  save(K_TX,TX); save(K_STASH,STASH);
  closeSheet(); render();
}

$("histClose").onclick=()=>{$("hist").classList.remove("open")};
$("histList").addEventListener("click",e=>{
  const r=e.target.closest(".prow"); if(!r) return;
  const now=periodOf(iso(new Date()));
  VIEW_PID=r.dataset.pid===now?null:r.dataset.pid;
  $("hist").classList.remove("open"); render();
});
$("expBtn").onclick=async()=>{
  const blob=JSON.stringify({tx:TX,stash:STASH,settled:SETTLED,exported:new Date().toISOString()});
  try{ await navigator.clipboard.writeText(blob); $("expBtn").textContent="Copied"; }
  catch(e){ prompt("Copy:",blob) }
  setTimeout(()=>$("expBtn").textContent="Copy all data as JSON",1500);
};

settleVault();
render();
renderVaultStatic();
requestAnimationFrame(vaultFrame);
playCelebs();
setInterval(()=>{ const p=periodOf(iso(new Date())); if(p!==V.lastPid){ settleVault(); render(); renderVaultStatic(); playCelebs(); } },30000);
window.addEventListener("pagehide",()=>{ V.shown=pour().lifetime+pendingNow(); save(K_VAULT,V); });
</script>
</body>
</html>
